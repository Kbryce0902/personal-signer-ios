name: Build unsigned iOS IPAs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-ipas.yml"
      - "PersonalSigner.xcodeproj/**"
      - "Signer/**"
      - "StorageProbe/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  device-ipas:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and verify unsigned iPhone IPAs
        run: bash scripts/build-ipas.sh
      - name: Save the verified IPAs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PersonalSigner-unsigned-ipas
          path: build/ipas/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
