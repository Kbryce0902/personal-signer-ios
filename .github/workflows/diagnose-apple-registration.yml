name: Diagnose local Apple provisioning
on:
  push:
    branches: [diagnostics/adi-provisioning]
permissions:
  contents: read
jobs:
  alternative:
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check the alternative provider without an Apple Account
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf -- "$scratch"' EXIT
          curl --fail --silent --show-error --location --max-time 60 https://github.com/apple-auth/apple-auth/releases/download/v0.1.3/AppleAuth.zip -o "$scratch/AppleAuth.zip"
          (cd "$scratch"; printf '%s\n' '183c9bb77a97f98d2c1369be0ade5a5238170b8598536c050dc52213550b98fd  AppleAuth.zip' | shasum -a 256 -c -)
          unzip -q "$scratch/AppleAuth.zip" -d "$scratch"
          mkdir -p "$scratch/Sources/Probe"
          cp scripts/diagnose-apple-alternative.swift "$scratch/Sources/Probe/Probe.swift"
          cat > "$scratch/Package.swift" <<'SWIFT'
          // swift-tools-version:5.9
          import PackageDescription
          let package = Package(name: "Probe", platforms: [.macOS(.v12)],
              dependencies: [.package(path: "AppleAuth")],
              targets: [.executableTarget(name: "Probe", dependencies: [
                  .product(name: "AppleAuth", package: "AppleAuth")
              ])])
          SWIFT
          swift run --package-path "$scratch" Probe
